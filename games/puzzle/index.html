<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>도깨비 직소퍼즐 · 코딩도깨비</title>
  <meta name="description" content="그림이나 내 사진을 골라 4조각부터 48조각까지 맞춰 보는 직소퍼즐">
  <meta name="theme-color" content="#FFF6E5">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/games/puzzle/puzzle.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/games/puzzle/">
      <img src="/logo.png" alt="" width="44" height="44">
      <span>도깨비 직소퍼즐</span>
    </a>
    <a class="back" href="/">← 코딩도깨비로</a>
  </header>

  <!-- 준비: 그림과 조각 수 고르기 -->
  <main class="setup" id="setup">
    <section class="step">
      <h2><i>1</i> 어떤 그림으로 맞출까요?</h2>
      <div class="pics" id="pics">
        <label class="pic photo" id="photoCard">
          <input type="file" accept="image/*" id="photoInput" hidden>
          <span class="thumb"><b>📷</b><img id="photoThumb" alt="" hidden></span>
          <span class="picName">내 사진</span>
        </label>
      </div>
      <p class="note">내 사진은 이 기기 안에서만 쓰고 인터넷에 올라가지 않아요.</p>
    </section>

    <section class="step">
      <h2><i>2</i> 몇 조각으로 할까요?</h2>
      <div class="sizes" id="sizes"></div>
    </section>

    <button class="big go" id="start">🧩 퍼즐 시작!</button>
  </main>

  <!-- 퍼즐 맞추기 -->
  <main class="game" id="game" hidden>
    <div class="bar">
      <button class="pill" id="toSetup">🏠 그림 고르기</button>
      <span class="chip time">⏱️ <b id="time">0:00</b></span>
      <span class="chip count">
        🧩 <b id="count">0 / 0</b>
        <span class="meter"><span id="meter"></span></span>
      </span>
      <button class="pill" id="hint" aria-pressed="true">👀 밑그림 끄기</button>
      <button class="pill" id="shuffle">🔀 다시 섞기</button>
    </div>
    <div class="area" id="area">
      <div class="board" id="board"><canvas id="guide"></canvas></div>
    </div>
  </main>

  <!-- 다 맞췄을 때 -->
  <div class="pop" id="pop" hidden>
    <div class="popBox" role="dialog" aria-modal="true" aria-labelledby="popTitle">
      <b class="popFace">🎉</b>
      <h3 id="popTitle">다 맞췄어요!</h3>
      <p id="popMsg"></p>
      <div class="acts">
        <button class="big go" id="again">🔁 한 번 더</button>
        <button class="big soft" id="other">🖼️ 다른 그림</button>
      </div>
    </div>
  </div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script src="/games/puzzle/pictures.js"></script>
  <script src="/games/puzzle/puzzle.js"></script>
</body>
</html>
