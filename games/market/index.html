<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>도깨비 시장놀이 · 코딩도깨비</title>
  <meta name="description" content="장바구니 물건값을 동전·지폐로 내 보고, 내 가게를 차려 친구에게 물건을 팔아 보는 시장놀이">
  <meta name="theme-color" content="#23272E">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/games/market/market.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/games/market/" id="brand">
      <img src="/logo.png" alt="" width="44" height="44">
      <span>도깨비 시장놀이</span>
    </a>
    <a class="back" href="/">← 코딩도깨비로</a>
  </header>

  <!-- 첫 화면: 놀이 고르기 -->
  <main class="home" id="home">
    <p class="hello">어떤 놀이를 할까요?</p>
    <div class="choices">
      <button class="choice" data-go="buy">
        <b>🧺</b>
        <strong>장보기</strong>
        <span>물건값만큼 돈을 내 봐요</span>
      </button>
      <button class="choice" data-go="store">
        <b>🏪</b>
        <strong>내 가게 차리기</strong>
        <span>가게 주인이 되어 팔아 봐요</span>
      </button>
    </div>
  </main>

  <!-- 장보기 -->
  <main class="play" id="buy" hidden>
    <div class="bar">
      <button class="pill" data-go="home">🏠 처음으로</button>
      <label class="level">
        <span>단계</span>
        <select id="level"></select>
      </label>
      <span class="stars" id="stars" aria-live="polite">⭐ 0</span>
    </div>

    <div class="desk">
      <section class="card basket">
        <h2>🧺 <span class="u">장바구니</span></h2>
        <div class="goods" id="goods"></div>
        <h2 class="mt">📋 <span class="u">가격표</span></h2>
        <ul class="prices" id="prices"></ul>
        <p class="ask" id="ask"></p>
        <button class="pill hint" id="hint">💡 힌트</button>
        <p class="hintText" id="hintText" hidden></p>
      </section>

      <section class="card wallet">
        <div class="paid">
          <span class="paidLabel" id="paidLabel">낸 돈</span>
          <strong id="paid">0원</strong>
        </div>
        <div class="tray" id="tray" aria-label="낸 돈 (누르면 다시 가져와요)"></div>
        <p class="tip">돈을 누르면 내고, 위에 낸 돈을 누르면 다시 가져와요.</p>
        <div class="money" id="money"></div>
        <div class="acts">
          <button class="big go" id="check">계산 완료</button>
          <button class="big soft" id="reset">다시 하기</button>
        </div>
      </section>
    </div>
  </main>

  <!-- 내 가게: 준비 -->
  <main class="play" id="store" hidden>
    <div class="bar">
      <button class="pill" data-go="home">🏠 처음으로</button>
      <span class="barTitle">가게 준비하기</span>
    </div>
    <section class="card setup">
      <label class="field">
        <span>가게 이름</span>
        <input id="shopName" maxlength="14" placeholder="예) 도깨비 과일가게">
      </label>
      <p class="label">무슨 가게를 열까요?</p>
      <div class="kinds" id="kinds"></div>
      <p class="label">팔 물건을 고르고 값을 정해요 <small>(＋ − 를 누르면 100원씩 바뀌어요)</small></p>
      <ul class="stock" id="stock"></ul>
      <button class="big go wide" id="open">🎉 가게 문 열기</button>
    </section>
  </main>

  <!-- 내 가게: 장사 -->
  <main class="play" id="shop" hidden>
    <div class="bar">
      <button class="pill" id="editShop">🛠️ 가게 고치기</button>
      <span class="sign" id="sign"></span>
      <span class="sales" id="sales">번 돈 0원</span>
      <button class="pill dark" id="close">📒 장사 끝내기</button>
    </div>

    <div class="desk">
      <section class="card">
        <h2>🛍️ 손님: 사고 싶은 물건을 눌러요</h2>
        <div class="shelf" id="shelf"></div>
      </section>

      <section class="card counter">
        <!-- 1. 장바구니 -->
        <div id="stepCart">
          <h2>🧺 손님 장바구니</h2>
          <ul class="cart" id="cart"></ul>
          <p class="total">모두 <strong id="cartTotal">0원</strong></p>
          <button class="big go wide" id="toPay" disabled>💳 계산하기</button>
        </div>

        <!-- 2. 손님이 돈 내기 / 3. 주인이 거스름돈 주기 -->
        <div id="stepMoney" hidden>
          <h2 id="moneyTitle"></h2>
          <p class="bill" id="moneyInfo"></p>
          <div class="paid">
            <span class="paidLabel" id="shopPaidLabel">낸 돈</span>
            <strong id="shopPaid">0원</strong>
          </div>
          <div class="tray" id="shopTray"></div>
          <div class="money" id="shopMoney"></div>
          <div class="acts">
            <button class="big go" id="shopOk">다 냈어요</button>
            <button class="big soft" id="shopBack">← 뒤로</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- 장사 끝: 장부 -->
  <main class="play" id="book" hidden>
    <div class="bar">
      <button class="pill" data-go="home">🏠 처음으로</button>
      <span class="barTitle">📒 오늘의 장부</span>
    </div>
    <section class="card setup">
      <div class="sum" id="bookSum"></div>
      <ul class="ledger" id="ledger"></ul>
      <div class="acts">
        <button class="big go" id="again">🏪 다시 장사하기</button>
        <button class="big soft" id="newShop">🆕 새 가게 만들기</button>
      </div>
    </section>
  </main>

  <!-- 알림 창 -->
  <div class="pop" id="pop" hidden>
    <div class="popBox" role="dialog" aria-modal="true" aria-labelledby="popMsg">
      <b id="popFace"></b>
      <p id="popMsg"></p>
      <button class="big go" id="popOk">확인</button>
    </div>
  </div>

  <script src="/games/market/market.js"></script>
</body>
</html>
