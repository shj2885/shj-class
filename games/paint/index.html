<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>말랑 그림판 · 코딩도깨비</title>
  <meta name="description" content="연필·크레파스·스프레이·물감·도장으로 그림을 그리고 내 컴퓨터에 저장하는 그림판">
  <meta name="theme-color" content="#F6F5F0">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/games/paint/paint.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">
      <img src="/logo.png" alt="" width="44" height="44">
      <span>말랑 그림판</span>
    </a>
    <a class="back" href="/">← 코딩도깨비로</a>
  </header>

  <div class="bar" role="toolbar" aria-label="종이와 저장">
    <label class="page">
      <span>📄 종이</span>
      <select id="page">
        <option value="1200x800">가로</option>
        <option value="800x1200">세로</option>
        <option value="1000x1000">네모</option>
      </select>
    </label>
    <button class="pill" id="undo" title="되돌리기 (Ctrl+Z)">↶<span class="t"> 되돌리기</span></button>
    <button class="pill" id="redo" title="다시 하기 (Ctrl+Y)">↷<span class="t"> 다시 하기</span></button>
    <button class="pill" id="clear">🧹<span class="t"> 새로 그리기</span></button>
    <button class="pill" id="open">📂<span class="t"> 불러오기</span></button>
    <input type="file" id="file" accept="image/*" hidden>
    <button class="pill save" id="save">💾 저장</button>
    <button class="pill share" id="share">🖼️ 전시판에 올리기</button>
  </div>

  <main class="studio">
    <section class="board" id="board">
      <div class="paper" id="paper">
        <canvas id="canvas" aria-label="그림 그리는 종이"></canvas>
        <canvas id="ghost" aria-hidden="true"></canvas>
        <div class="grid" id="grid" hidden></div>
      </div>
    </section>

    <aside class="toolbox" aria-label="도구 상자">
      <h2>도구</h2>
      <div class="tools" id="tools">
        <button class="tool" data-tool="pencil" aria-pressed="true"><b>✏️</b>연필</button>
        <button class="tool" data-tool="crayon"><b>🖍️</b>크레파스</button>
        <button class="tool" data-tool="spray"><b>💨</b>스프레이</button>
        <button class="tool" data-tool="fill"><b>🪣</b>물감</button>
        <button class="tool" data-tool="shape"><b>🔷</b>도형</button>
        <button class="tool" data-tool="stamp"><b>❤️</b>도장</button>
        <button class="tool" data-tool="eraser"><b>🧽</b>지우개</button>
        <button class="tool" id="gridBtn" aria-pressed="false" title="줄 바탕은 저장되지 않아요"><b>▦</b>격자</button>
      </div>

      <div class="options" id="shapeOpts" hidden>
        <div class="chips" id="shapes">
          <button class="chip" data-shape="rect" aria-pressed="true" aria-label="네모">⬜</button>
          <button class="chip" data-shape="circle" aria-label="동그라미">⚪</button>
          <button class="chip" data-shape="tri" aria-label="세모">🔺</button>
          <button class="chip" data-shape="star" aria-label="별">⭐</button>
          <button class="chip" data-shape="line" aria-label="선">➖</button>
        </div>
        <label class="check"><input type="checkbox" id="shapeFill"> 속까지 칠하기</label>
      </div>

      <div class="options" id="stampOpts" hidden>
        <div class="chips" id="stamps"></div>
      </div>

      <h2>색 <i class="now" id="now"></i></h2>
      <div class="colors" id="colors"></div>
      <label class="more-color">🎨 다른 색 <input type="color" id="picker" value="#141414"></label>

      <h2>굵기</h2>
      <div class="size">
        <input type="range" id="size" min="1" max="10" value="3" aria-label="굵기">
        <span class="dot-wrap"><i class="dot" id="dot"></i></span>
      </div>
    </aside>
  </main>

  <section class="gallery" id="gallery" aria-labelledby="galleryTitle">
    <div class="gallery-head">
      <h2 id="galleryTitle">🖼️ 친구들 작품</h2>
      <button class="pill lock" id="teacher">🔒 선생님</button>
    </div>
    <p class="gallery-note">선생님이 확인한 그림만 여기에 나와요.</p>

    <!-- 선생님 모드: 비밀번호를 넣은 뒤에만 보인다 -->
    <div class="teach" id="teach" hidden>
      <div class="tabs" role="tablist">
        <button class="pill" data-status="pending" aria-pressed="true">⏳ 기다리는 그림 <b data-count="pending">0</b></button>
        <button class="pill" data-status="approved" aria-pressed="false">✅ 전시 중 <b data-count="approved">0</b></button>
        <button class="pill" data-status="hidden" aria-pressed="false">🙈 숨긴 그림 <b data-count="hidden">0</b></button>
        <button class="pill" id="teachOff">끝내기</button>
      </div>
      <div class="cards" id="teachCards"></div>
      <p class="empty" id="teachEmpty" hidden>여기에는 그림이 없어요.</p>
    </div>

    <div class="cards" id="cards"></div>
    <p class="empty" id="empty" hidden>아직 전시된 그림이 없어요. 첫 번째 작가가 되어 볼까요? ✨</p>
    <button class="pill more" id="more" hidden>더 보기</button>
  </section>

  <dialog id="shareDlg" class="share-dlg">
    <form method="dialog" id="shareForm">
      <h3>🖼️ 전시판에 올리기</h3>
      <img id="shareThumb" alt="올릴 그림">
      <label>별명 <small>(안 써도 돼요)</small>
        <input name="nickname" maxlength="12" placeholder="예: 그림왕 도깨비" autocomplete="off">
      </label>
      <label>그림 제목 <small>(안 써도 돼요)</small>
        <input name="title" maxlength="20" placeholder="예: 우리 집" autocomplete="off">
      </label>
      <p class="warn">⚠️ <b>진짜 이름</b>, <b>얼굴 사진</b>, 학교·전화번호는 넣지 않아요.<br>선생님이 확인한 뒤에 전시판에 나와요.</p>
      <div class="ask-btns">
        <button class="pill" value="cancel" formnovalidate>그만두기</button>
        <button class="pill save" id="shareGo" type="button">올리기</button>
      </div>
    </form>
  </dialog>

  <dialog id="viewDlg" class="view-dlg">
    <img id="viewImg" alt="">
    <p id="viewCap"></p>
    <form method="dialog"><button class="pill">닫기</button></form>
  </dialog>

  <dialog id="pwDlg">
    <form method="dialog" id="pwForm">
      <p>선생님 비밀번호</p>
      <input type="password" id="pwInput" autocomplete="current-password" aria-label="선생님 비밀번호">
      <p class="err" id="pwErr" hidden></p>
      <div class="ask-btns">
        <button class="pill" value="cancel" formnovalidate>그만두기</button>
        <button class="pill save" id="pwGo" type="button">들어가기</button>
      </div>
    </form>
  </dialog>

  <dialog id="ask">
    <p id="askText"></p>
    <div class="ask-btns">
      <button class="pill" id="askNo">아니요</button>
      <button class="pill danger" id="askYes">네</button>
    </div>
  </dialog>

  <script src="/games/paint/paint.js"></script>
  <script src="/games/paint/gallery.js"></script>
</body>
</html>
