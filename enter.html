<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>들어가기 | 혜정쌤의 에듀깨비</title>
  <meta name="theme-color" content="#F6F5F0">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <!-- 이 화면은 비밀번호를 넣기 전에 보이므로 styles.css 대신 여기에 모양을 다 넣는다 -->
  <style>
    :root {
      --bg: #F6F5F0; --card: #FFFFFF; --line: #E7E5DE; --ink: #141414; --ink-soft: #5E5C56;
      --lime: #C9F23D; --lime-soft: #EEFBC4;
      --sans: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 18px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .box {
      width: min(440px, 100%); padding: 34px 28px 30px; border-radius: 36px; text-align: center;
      background: var(--card); border: 1.5px solid var(--line); box-shadow: 0 30px 60px -36px rgba(20, 20, 20, .35);
    }
    .logo { width: 96px; height: 96px; display: block; margin: 0 auto 6px; }
    .owner { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.03em; }
    h1 { margin: 0; font-size: 44px; font-weight: 900; letter-spacing: -0.05em; line-height: 1.15; }
    h1 span { background: linear-gradient(transparent 56%, var(--lime) 56% 94%, transparent 94%); padding: 0 .06em; }
    .lede { margin: 14px 0 22px; color: var(--ink-soft); font-size: 17px; font-weight: 600; }
    form { display: grid; gap: 12px; }
    label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    input {
      width: 100%; min-height: 72px; padding: 0 18px; border: 2px solid var(--ink); border-radius: 20px;
      background: #fff; color: var(--ink); text-align: center;
      font: inherit; font-size: 34px; font-weight: 800; letter-spacing: .4em; text-indent: .4em;
    }
    input::placeholder { color: #B4B1A8; letter-spacing: 0; font-size: 19px; font-weight: 700; }
    input:focus { outline: 4px solid var(--lime); outline-offset: 0; }
    button {
      min-height: 64px; border: 0; border-radius: 999px; cursor: pointer;
      background: var(--ink); color: #fff; font: inherit; font-size: 22px; font-weight: 900; letter-spacing: -0.02em;
    }
    button:hover { background: #000; }
    button:disabled { opacity: .6; cursor: default; }
    .msg { min-height: 1.5em; margin: 2px 0 0; color: #B3261E; font-size: 16px; font-weight: 800; }
    .shake { animation: shake .35s; }
    @keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
    .foot { margin: 18px 0 0; color: var(--ink-soft); font-size: 14px; font-weight: 600; }
  </style>
</head>
<body>
  <main class="box">
    <img class="logo" src="/logo.png" alt="" width="96" height="96">
    <p class="owner">혜정쌤의</p>
    <h1><span>에듀깨비</span></h1>
    <p class="lede">숫자 4자리 수업 비밀번호를 넣고 들어오세요.</p>
    <form id="form" autocomplete="off">
      <label for="pw">수업 비밀번호</label>
      <input id="pw" type="password" inputmode="numeric" placeholder="숫자 4자리" required autofocus>
      <button type="submit" id="go">들어가기</button>
      <p class="msg" id="msg" role="alert"></p>
    </form>
    <p class="foot">비밀번호는 선생님께 물어보세요.</p>
  </main>
  <script>
    (() => {
      const form = document.getElementById('form'), pw = document.getElementById('pw');
      const msg = document.getElementById('msg'), go = document.getElementById('go');
      // 들어오려던 주소로 돌려보낸다. 이 사이트 안의 주소만.
      const next = new URLSearchParams(location.search).get('next') || '/';
      const target = /^\/(?!\/)/.test(next) ? next : '/';
      // 숫자만 들어가게 하고, 4자리를 다 넣으면 바로 확인한다
      pw.addEventListener('input', () => {
        pw.value = pw.value.replace(/\D/g, '').slice(0, 4);
        if (pw.value.length === 4 && !go.disabled) form.requestSubmit();
      });
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!/^\d{4}$/.test(pw.value)) { msg.textContent = '숫자 4자리를 넣어 주세요.'; pw.focus(); return; }
        go.disabled = true; msg.textContent = '';
        try {
          const r = await fetch('/api/enter', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pw.value }),
          });
          const data = await r.json().catch(() => ({}));
          if (r.ok) { location.replace(target); return; }
          msg.textContent = data.error || '확인하지 못했어요. 잠시 뒤 다시 해 보세요.';
          if (r.status === 401) {
            form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
            pw.value = ''; pw.focus();
          }
        } catch {
          msg.textContent = '확인하지 못했어요. 인터넷 연결을 확인해 주세요.';
        }
        go.disabled = false;
      });
    })();
  </script>
</body>
</html>
