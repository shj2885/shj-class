<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>링크 관리 | 혜정쌤의 에듀깨비</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="/" target="_blank" rel="noopener"><small>혜정쌤의</small> 에듀깨비 <span>사이트 보기</span></a>
    <button type="button" class="ghost" id="logout" hidden>나가기</button>
  </header>

  <main>
    <form class="login" id="login-form" autocomplete="off">
      <h1>링크 관리</h1>
      <label for="pw">관리자 비밀번호</label>
      <input id="pw" name="pw" type="password" required autocomplete="current-password">
      <button type="submit" class="solid">들어가기</button>
      <p class="msg" id="login-msg" role="alert"></p>
    </form>

    <div id="panel" hidden>
      <form class="add gate" id="gate-form" autocomplete="off">
        <h2>🔑 입장 비밀번호</h2>
        <p class="hint" id="gate-now"></p>
        <div class="row">
          <input name="pw" id="gate-pw" maxlength="40" placeholder="예: 1234" aria-label="새 입장 비밀번호">
          <button type="submit" class="solid">바꾸기</button>
        </div>
        <p class="hint">사이트에 처음 들어올 때 넣는 비밀번호예요. 비워 두고 바꾸면 누구나 들어와요.</p>
        <p class="msg" id="gate-msg" role="alert"></p>
      </form>

      <section class="summary">
        <p class="count"><strong id="today-count">0</strong>개</p>
        <p>오늘 쓸 사이트로 첫 화면 맨 위에 보여요.</p>
      </section>

      <form class="add" id="add-form" autocomplete="off">
        <h2 id="form-title">사이트 추가</h2>
        <label>주소<input name="url" required inputmode="url" placeholder="예: https://playentry.org"></label>
        <label>사이트 이름<input name="name" maxlength="60" placeholder="비우면 주소에서 따와요"></label>
        <div class="pair">
          <label>메뉴<select name="category" id="menu-select" required></select></label>
          <label>펼침 메뉴<select name="sub" id="sub-select"></select></label>
        </div>
        <p class="hint" id="teacher-hint" hidden>선생님용은 학생 화면에 보이지 않아요. 이 관리자 화면에서만 보고 열 수 있어요.</p>
        <label class="check"><input type="checkbox" name="today"> 오늘 쓸 사이트로 올리기</label>
        <div class="row">
          <button type="submit" class="solid" id="form-submit">사이트 추가</button>
          <button type="button" class="ghost" id="form-cancel" hidden>고치기 취소</button>
        </div>
        <p class="msg" id="form-msg" role="alert"></p>
      </form>

      <div id="groups"></div>
    </div>
  </main>

  <p class="toast" id="toast" role="status" aria-live="polite"></p>
  <script src="/menus.js" defer></script>
  <script src="/admin/admin.js" defer></script>
</body>
</html>
