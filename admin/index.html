<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>링크 관리 | 코딩도깨비</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="/" target="_blank" rel="noopener">코딩도깨비 <span>사이트 보기</span></a>
    <button type="button" class="ghost" id="logout" hidden>나가기</button>
  </header>

  <main>
    <form class="login" id="login-form" autocomplete="off">
      <h1>링크 관리</h1>
      <label for="pw">관리자 비밀번호</label>
      <input id="pw" name="pw" type="password" required autocomplete="current-password">
      <button type="submit" class="solid">들어가기</button>
      <p class="msg" id="login-msg" role="alert"></p>
    </form>

    <div id="panel" hidden>
      <section class="summary">
        <p class="count"><strong id="today-count">0</strong>개</p>
        <p>오늘 쓸 사이트로 첫 화면 맨 위에 보여요.</p>
      </section>

      <form class="add" id="add-form" autocomplete="off">
        <h2 id="form-title">사이트 추가</h2>
        <label>사이트 이름<input name="name" required maxlength="60" placeholder="예: Claude"></label>
        <label>주소<input name="url" required inputmode="url" placeholder="예: https://claude.ai"></label>
        <label>묶음
          <select name="category" required>
            <option value="ai">AI 도구</option>
            <option value="design">디자인·이미지 도구</option>
            <option value="class">수업 자료·과제</option>
            <option value="collab">협업·저장 도구</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" name="today"> 오늘 쓸 사이트로 올리기</label>
        <div class="row">
          <button type="submit" class="solid" id="form-submit">사이트 추가</button>
          <button type="button" class="ghost" id="form-cancel" hidden>고치기 취소</button>
        </div>
        <p class="msg" id="form-msg" role="alert"></p>
      </form>

      <div id="groups"></div>
    </div>
  </main>

  <p class="toast" id="toast" role="status" aria-live="polite"></p>
  <script src="/admin/admin.js" defer></script>
</body>
</html>
