<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>자료실 · 에듀깨비</title>
  <meta name="description" content="강의에서 받은 자료를 폴더별로 모아 둔 곳">
  <meta name="theme-color" content="#F6F5F0">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/notes/notes.css">
</head>
<body class="library">
  <header class="top">
    <a class="brand" href="/notes/"><img src="/logo.png" alt="" width="46" height="46"><span>자료실</span></a>
    <span class="top-actions">
      <button type="button" class="back" id="teacher-btn">🔒 선생님</button>
      <a class="back" href="/">← 에듀깨비로</a>
    </span>
  </header>

  <main>
    <!-- 첫 화면: 폴더들 + 폴더에 안 넣은 자료 -->
    <section id="home-view">
      <div class="intro">
        <h1><span class="hl">자료실</span></h1>
        <p>강의에서 받은 자료를 폴더별로 모았어요. 프롬프트 상자는 복사 버튼으로 바로 가져갈 수 있어요.</p>
      </div>
      <div class="folders" id="folders"></div>
      <h2 class="group-title" id="loose-title">폴더에 안 넣은 자료</h2>
      <ul class="list" id="loose"></ul>
    </section>

    <!-- 폴더 하나를 열었을 때 -->
    <section id="folder-view" hidden>
      <nav class="crumb" aria-label="위치"><a href="#">자료실</a> <span aria-hidden="true">›</span> <b id="folder-name"></b></nav>
      <div class="folder-head">
        <h1><span id="folder-emoji"></span> <span class="hl" id="folder-title"></span></h1>
        <span class="teacher-only folder-tools">
          <button type="button" class="tool" id="folder-rename">✏️ 이름 바꾸기</button>
          <button type="button" class="tool danger" id="folder-delete">🗑 폴더 지우기</button>
        </span>
      </div>
      <ul class="list" id="in-folder"></ul>
    </section>

    <p class="load-error" id="load-error" role="alert" hidden>폴더를 불러오지 못했어요. 지금은 모든 자료를 한곳에 보여 드려요.</p>
  </main>

  <!-- 선생님 모드: 비밀번호 확인 (첫 화면 선생님 모드와 같은 비밀번호) -->
  <dialog class="dlg" id="login-dlg" aria-labelledby="login-title">
    <form method="dialog" id="login-form" autocomplete="off">
      <h2 id="login-title">선생님 모드</h2>
      <p class="dlg-note">비밀번호를 넣으면 폴더를 만들고 자료를 폴더에 넣을 수 있어요.</p>
      <label>관리자 비밀번호<input id="login-pw" type="password" required autocomplete="current-password"></label>
      <p class="dlg-msg" id="login-msg" role="alert"></p>
      <div class="dlg-row">
        <button type="button" class="dlg-ghost" data-close>닫기</button>
        <button type="submit" class="dlg-solid">들어가기</button>
      </div>
    </form>
  </dialog>

  <!-- 선생님 모드: 폴더 만들기·이름 바꾸기 -->
  <dialog class="dlg" id="folder-dlg" aria-labelledby="folder-dlg-title">
    <form method="dialog" id="folder-form" autocomplete="off">
      <h2 id="folder-dlg-title">새 폴더</h2>
      <label>폴더 이름<input name="name" id="folder-input" maxlength="30" required placeholder="예: SW 강의, 유튜브 강의"></label>
      <fieldset class="emojis">
        <legend>그림</legend>
        <div id="emoji-pick"></div>
      </fieldset>
      <p class="dlg-msg" id="folder-msg" role="alert"></p>
      <div class="dlg-row">
        <button type="button" class="dlg-ghost" data-close>닫기</button>
        <button type="submit" class="dlg-solid" id="folder-submit">만들기</button>
      </div>
    </form>
  </dialog>

  <div class="teacher-bar" id="teacher-bar" hidden>
    <span>✏️ 선생님 모드 · 폴더를 만들고, 자료 카드 아래에서 폴더를 골라 넣어요</span>
    <span class="teacher-bar-actions">
      <button type="button" class="solid" id="bar-new">+ 새 폴더</button>
      <button type="button" id="bar-off">끄기</button>
    </span>
  </div>
  <p class="toast" id="toast" role="status" aria-live="polite"></p>

  <script src="/notes/catalog.js" defer></script>
  <script src="/notes/library.js" defer></script>
</body>
</html>
