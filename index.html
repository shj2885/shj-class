<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>코딩도깨비 | 내 손으로 뚝딱! 상상력은 쑥쑥!</title>
  <meta name="description" content="코딩도깨비: 수업에 필요한 사이트를 한곳에 모았어요. 누르면 바로 열려요.">
  <meta name="theme-color" content="#F6F5F0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#today">오늘 쓸 사이트로 바로 가기</a>

  <header class="nav">
    <a class="brand" href="/">
      <img class="logo" src="/logo.svg" alt="" width="48" height="48">
      <span class="brand-text"><span class="brand-name">코딩도깨비</span><span class="brand-sub">내 손으로 뚝딱! 상상력은 쑥쑥!</span></span>
    </a>
  </header>

  <main>
    <section class="hero" id="today" aria-labelledby="today-title">
      <h1 id="today-title"><span class="hl">오늘 수업</span></h1>
      <p class="lede">오늘 수업에 쓸 사이트, 여기서 바로 들어가세요. 누르면 새 탭에서 열려요.</p>
      <nav class="chips" id="chips" aria-label="묶음으로 이동"></nav>
      <ul class="today-list" id="today-list" aria-live="polite"></ul>
      <p class="today-empty" id="today-empty" hidden></p>
    </section>

    <div id="categories"></div>
    <p class="load-error" id="load-error" role="alert" hidden>목록을 불러오지 못했어요. 새로고침해 보세요.</p>
  </main>

  <footer class="foot">
    <div>
      <p class="foot-brand"><img class="logo" src="/logo.svg" alt="" width="40" height="40">코딩도깨비</p>
      <p class="foot-sub">내 손으로 뚝딱! 상상력은 쑥쑥!</p>
    </div>
    <p class="foot-note">사이트는 모두 새 탭에서 열려요.<br>이 화면은 그대로 남아 있으니 언제든 돌아오세요.</p>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
