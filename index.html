<!doctype html>
<html lang="ko">
<head>

  <meta name="theme-color" content="#F6F5F0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#today">오늘 수업으로 바로 가기</a>

  <header class="nav">
    <a class="brand" href="/">
      <img class="logo" src="/logo.svg" alt="" width="48" height="48">
      <span class="brand-text"><span class="brand-line"><span class="brand-owner">혜정쌤의</span> <span class="brand-name">코딩도깨비</span></span><span class="brand-sub">내 손으로 뚝딱! 상상력은 쑥쑥!</span></span>

    <button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="menubar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>메뉴

  </header>
  <nav class="menubar" id="menubar" aria-label="메뉴">
    <ul class="menu-list" id="menu-list"></ul>
  </nav>

  <main>
    <section class="hero" id="today" aria-labelledby="today-title">
      <h1 id="today-title"><span class="hl">오늘 수업</span></h1>
      <p class="lede">오늘 수업에 쓸 사이트, 여기서 바로 들어가세요. 누르면 새 탭에서 열려요.</p>
      <ul class="today-list" id="today-list" aria-live="polite"></ul>
      <p class="today-empty" id="today-empty" hidden></p>

    <div id="categories"></div>

  <footer class="foot">
    <div>
      <p class="foot-brand"><img class="logo" src="/logo.svg" alt="" width="40" height="40"><span class="brand-line"><span class="brand-owner">혜정쌤의</span> <span>코딩도깨비</span></span></p>
      <p class="foot-sub">내 손으로 뚝딱! 상상력은 쑥쑥!</p>
    </div>
    <p class="foot-note">사이트는 모두 새 탭에서 열려요.<br>이 화면은 그대로 남아 있으니 언제든 돌아오세요.</p>
  </footer>

  <script src="/menus.js" defer></script>
  <script src="/app.js" defer></script>
